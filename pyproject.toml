[project]
name = "homebuddy"
version = "0.3.2-dev"
description = "A companion for Home Assistant: finds device events in the sensor history"
authors = [
    { name = "Rato" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ev",
    "charging",
    "home-assistant",
    "energy",
    "power",
    "session",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "nicegui>=3.17.1",
    "platformdirs>=4.12.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
]

[project.urls]
Repository = "https://github.com/ratoaq2/homebuddy"

[project.scripts]
homebuddy = "homebuddy.ui:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "homebuddy/**",
    "scripts/**",
    "tests/**",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["homebuddy"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
